global
    log stdout format raw local0
    maxconn 256

defaults
    mode tcp
    log global
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 2s

resolvers cluster_dns
    parse-resolv-conf
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s

frontend entry_postgres
    bind :5432
    default_backend primary

backend primary
    option httpchk
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server data-1 "${HA_PG1_HOST}:5432" resolvers cluster_dns init-addr last,libc,none check port 8008 check-ssl check-sni "${HA_PG1_HOST}" verifyhost "${HA_PG1_HOST}" verify required ca-file /run/haproxy-tls/ca.crt crt /run/haproxy-tls/client.pem
    server data-2 "${HA_PG2_HOST}:5432" resolvers cluster_dns init-addr last,libc,none check port 8008 check-ssl check-sni "${HA_PG2_HOST}" verifyhost "${HA_PG2_HOST}" verify required ca-file /run/haproxy-tls/ca.crt crt /run/haproxy-tls/client.pem
